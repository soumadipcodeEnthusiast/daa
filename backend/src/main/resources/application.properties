spring.application.name=code-reverse

server.port=8095

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# AlgoLens: LLM snippet limit
algolens.llm.max-snippets=20

# Multipart: allow up to 10 MB uploads (5 MB hard limit enforced in IngestService)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Caffeine is the cache provider
spring.cache.type=caffeine
